<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Keyword Search</title>
  <style>
    :root, html[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #0f0f0f;
      --muted: #606060;
      --border: #eeeeee;
      --box-bg: #f8f8f8;
      --box-fg: #333333;
      --img-bg: #f0f0f0;
      --error: #b00020;
      --toggle-active: #0f0f0f;
      --toggle-active-fg: #ffffff;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f0f0f;
      --fg: #f1f1f1;
      --muted: #aaaaaa;
      --border: #272727;
      --box-bg: #1f1f1f;
      --box-fg: #e0e0e0;
      --img-bg: #272727;
      --error: #ff8a80;
      --toggle-active: #f1f1f1;
      --toggle-active-fg: #0f0f0f;
    }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        color-scheme: dark;
        --bg: #0f0f0f;
        --fg: #f1f1f1;
        --muted: #aaaaaa;
        --border: #272727;
        --box-bg: #1f1f1f;
        --box-fg: #e0e0e0;
        --img-bg: #272727;
        --error: #ff8a80;
        --toggle-active: #f1f1f1;
        --toggle-active-fg: #0f0f0f;
      }
    }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    .theme-toggle { display: flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; flex-shrink: 0; }
    .theme-toggle button { border: 0; background: transparent; color: var(--muted); font-size: 0.8rem; padding: 0.3rem 0.7rem; border-radius: 999px; cursor: pointer; }
    .theme-toggle button[aria-pressed="true"] { background: var(--toggle-active); color: var(--toggle-active-fg); }
    form { display: flex; gap: 0.5rem; margin: 1rem 0; }
    input[type="search"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    #status { color: var(--muted); margin: 0.5rem 0; }
    #status.error { color: var(--error); }
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    li img { width: 160px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--img-bg); flex-shrink: 0; }
    li a { color: var(--fg); text-decoration: none; font-weight: 500; }
    li a:hover { text-decoration: underline; }
    li small { display: block; color: var(--muted); font-weight: 400; margin-top: 0.2rem; }
    .transcript-btn { margin-top: 0.4rem; padding: 0.25rem 0.6rem; font-size: 0.85rem; cursor: pointer; }
    .transcript-btn + .transcript-btn { margin-left: 0.4rem; }
    .transcript { font-size: 0.85rem; color: var(--box-fg); background: var(--box-bg); border-radius: 8px; padding: 0.6rem; max-height: 160px; overflow-y: auto; white-space: pre-wrap; margin: 0.4rem 0 0; }
  </style>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("yt-theme") || "system";
    } catch (err) {
      document.documentElement.dataset.theme = "system";
    }
  </script>
</head>
<body>
  <header>
    <h1>YouTube Keyword Search</h1>
    <div class="theme-toggle" role="group" aria-label="Color theme">
      <button type="button" data-set-theme="system">System</button>
      <button type="button" data-set-theme="light">Light</button>
      <button type="button" data-set-theme="dark">Dark</button>
    </div>
  </header>
  <p>No API key needed — powered by the <code>yt-search</code> library.</p>

  <form id="searchForm">
    <input id="keyword" type="search" placeholder="Enter keyword, e.g. lofi hip hop" required />
    <button type="submit">Search</button>
  </form>

  <p id="status" role="status"></p>
  <ul id="results"></ul>

  <script src="./app.js"></script>
  <script>
    (function () {
      var buttons = document.querySelectorAll("[data-set-theme]");
      function current() {
        return document.documentElement.dataset.theme || "system";
      }
      function paint() {
        buttons.forEach(function (b) {
          b.setAttribute("aria-pressed", String(b.dataset.setTheme === current()));
        });
      }
      buttons.forEach(function (b) {
        b.addEventListener("click", function () {
          document.documentElement.dataset.theme = b.dataset.setTheme;
          try {
            localStorage.setItem("yt-theme", b.dataset.setTheme);
          } catch (err) {}
          paint();
        });
      });
      paint();
    })();
  </script>
</body>
</html>
